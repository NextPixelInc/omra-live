# Essai : le direct officiel de Quran TV (hors YouTube) est-il lisible depuis les machines de GitHub ?
name: essai
on: workflow_dispatch
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          i=0
          for u in "http://m.live.net.sa:1935/live/quran/gmswf.m3u8" "https://live.kwikmotion.com/sbrksaquranlive/srpksaquran/playlist.m3u8" "https://live.kwikmotion.com/sbrksaqurangovsalive/srpksaquran/playlist.m3u8"; do
            i=$((i+1))
            timeout 40 ffmpeg -loglevel error -y -i "$u" -vf scale=960:-2 -frames:v 1 frame-$i.jpg && echo "OK $u" || echo "ECHEC $u"
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with: { name: frames, path: "frame-*.jpg" }
